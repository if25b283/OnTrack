<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnTrack - Timer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="timer-page">

    <div id="main-header"></div>

    <main class="page-main timer-main">
        <div class="timer-container">

            <div class="timer-mode-buttons">
                <button class="timer-mode-btn active" id="studyBtn">
                    📖 Study
                </button>

                <button class="timer-mode-btn" id="breakBtn">
                    ☕ Break
                </button>
            </div>

            <div class="timer-display" id="display">25:00</div>

            <div class="timer-controls">
                <button class="timer-ctrl-btn" id="resetBtn" title="Reset">
                    ↺
                </button>

                <button class="timer-start-btn" id="startPauseBtn">
                    <span id="playPauseIcon">▶</span>
                    <span id="startPauseLabel">Start</span>
                </button>

                <button class="timer-ctrl-btn" id="settingsBtn" title="Settings">
                    ⚙
                </button>
            </div>

            <button class="timer-subject-button" id="subjectButton">
                <span id="subjectButtonTitle">📚 Lernfach auswählen</span>
                <span id="subjectButtonInfo">Wähle ein Fach aus, bevor du lernst</span>
            </button>

        </div>
    </main>

    <div class="timer-settings-popup" id="settingsPopup">
        <h3>Settings</h3>

        <div class="settings-row">
            <label>Study Time</label>
            <input type="number" id="studyTimeInput" value="25" min="1" max="120">
        </div>

        <div class="settings-row">
            <label>Break Time</label>
            <input type="number" id="breakTimeInput" value="5" min="1" max="60">
        </div>

        <div class="settings-actions">
            <button class="settings-close-btn" id="closeSettingsBtn">Cancel</button>
            <button class="settings-save-btn" id="saveSettingsBtn">Save</button>
        </div>
    </div>

    <div class="timer-subject-popup" id="subjectPopup">
        <div class="subject-popup-box">
            <div class="subject-popup-header">
                <h3>Lernfach auswählen</h3>
                <button id="closeSubjectPopup">✕</button>
            </div>

            <div class="subject-add-row">
                <input type="text" id="newSubjectInput" placeholder="z.B. Mathe">
                <button id="addSubjectBtn">Hinzufügen</button>
            </div>

            <div class="subject-current-box" id="currentSubjectBox">
                Noch kein Fach ausgewählt
            </div>

            <div class="subject-list" id="subjectList"></div>
        </div>
    </div>

    <script type="module" src="header.js"></script>
    <script type="module" src="timer.js"></script>
</body>

</html>
