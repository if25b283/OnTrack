<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnTrack - To-Do</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="todo-page">

    <div id="main-header"></div>

    <main class="page-main todo-main">
        <div class="todo-container">

            <div class="todo-header">
                <h2 class="todo-title">My To-Do's</h2>

                <div class="todo-header-actions">
                    <select class="todo-sort-select" id="sort-select">
                        <option value="newest">▼ Newest</option>
                        <option value="oldest">▲ Oldest</option>
                        <option value="due">⏰ Due Date</option>
                        <option value="priority">⚑ Priority</option>
                    </select>

                    <button class="todo-add-btn" id="open-add-modal">+ Add</button>
                </div>
            </div>

            <div class="priority-legend">
                <span><i class="legend-dot urgent"></i> Dringend</span>
                <span><i class="legend-dot important"></i> Wichtig</span>
                <span><i class="legend-dot low"></i> Nicht so wichtig</span>
            </div>

            <div class="todo-list" id="todo-list">
                <div class="todo-loading">Loading tasks…</div>
            </div>

        </div>
    </main>

    <div class="modal-overlay" id="add-task-modal">
        <div class="post-modal todo-modal">

            <div class="modal-header">
                <h2>New Task</h2>
                <button class="modal-close-btn" id="close-add-modal">✕</button>
            </div>

            <div class="modal-body todo-modal-body">

                <div class="edit-field">
                    <label>Title</label>
                    <input type="text" id="task-title-input" placeholder="What do you need to do?">
                </div>

                <div class="edit-field">
                    <label>Due Date (optional)</label>
                    <input type="date" id="task-due-input">
                </div>

                <div class="edit-field">
                    <label>Priority</label>
                    <select id="task-priority-input" class="priority-select">
                        <option value="urgent">Dringend</option>
                        <option value="important" selected>Wichtig</option>
                        <option value="low">Nicht so wichtig</option>
                    </select>
                </div>

                <div class="edit-field">
                    <label>Assign to (optional)</label>

                    <div class="member-search-wrapper">
                        <input type="text" id="assignee-search-input" placeholder="Search by username…"
                            autocomplete="off">
                        <div class="member-search-results" id="assignee-search-results"></div>
                    </div>

                    <div class="selected-members" id="selected-assignees"></div>
                </div>

            </div>

            <div class="modal-footer">
                <span></span>
                <button class="post-submit-btn" id="save-task-btn">Add Task</button>
            </div>

        </div>
    </div>

    <div class="modal-overlay" id="edit-task-modal">
        <div class="post-modal todo-modal">

            <div class="modal-header">
                <h2>Edit Task</h2>
                <button class="modal-close-btn" id="close-edit-modal">✕</button>
            </div>

            <div class="modal-body todo-modal-body">

                <div class="edit-field">
                    <label>Title</label>
                    <input type="text" id="edit-task-title-input" placeholder="Task title">
                </div>

                <div class="edit-field">
                    <label>Due Date</label>
                    <input type="date" id="edit-task-due-input">
                </div>

                <div class="edit-field">
                    <label>Priority</label>
                    <select id="edit-task-priority-input" class="priority-select">
                        <option value="urgent">Dringend</option>
                        <option value="important">Wichtig</option>
                        <option value="low">Nicht so wichtig</option>
                    </select>
                </div>

            </div>

            <div class="modal-footer">
                <button class="post-submit-btn modal-secondary-btn" id="cancel-edit-task-btn">Cancel</button>
                <button class="post-submit-btn" id="update-task-btn">Save Changes</button>
            </div>

        </div>
    </div>

    <div class="modal-overlay" id="delete-task-modal">
        <div class="post-modal delete-task-box">

            <div class="modal-header">
                <h2>Delete Task</h2>
                <button class="modal-close-btn" id="close-delete-modal">✕</button>
            </div>

            <div class="modal-body">
                <p class="delete-task-text">Delete this task for everyone?</p>
            </div>

            <div class="modal-footer">
                <button class="post-submit-btn delete-confirm-btn" id="confirm-delete-btn">Delete</button>
            </div>

        </div>
    </div>

    <div class="modal-overlay" id="task-detail-modal">
        <div class="post-modal task-detail-box">

            <div class="modal-header">
                <h2 id="task-detail-title">Task</h2>
                <button class="modal-close-btn" id="close-task-detail">✕</button>
            </div>

            <div class="modal-body task-detail-body" id="task-detail-body"></div>

            <div class="modal-footer task-detail-footer" id="task-detail-footer">
                <button class="post-submit-btn" id="edit-task-from-detail-btn">Edit</button>
                <button class="post-submit-btn delete-confirm-btn" id="delete-task-from-detail-btn">Delete</button>
            </div>

        </div>
    </div>

    <script type="module" src="header.js"></script>
    <script type="module" src="todo.js"></script>
</body>

</html>
