<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnTrack Calendar</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="calendar-page">

  <div id="main-header"></div>

  <main class="calendar-main">
    <section class="calendar-wrapper">

      <div class="calendar-header">
        <button id="prevMonth">‹</button>
        <h1 id="calendarTitle"></h1>
        <button id="nextMonth">›</button>
      </div>

      <div class="weekdays">
        <div>MONDAY</div>
        <div>TUESDAY</div>
        <div>WEDNESDAY</div>
        <div>THURSDAY</div>
        <div>FRIDAY</div>
        <div>SATURDAY</div>
        <div>SUNDAY</div>
      </div>

      <div class="calendar-grid" id="calendarGrid"></div>
    </section>
  </main>

  <!-- Add Event Modal -->
  <div class="event-modal" id="eventModal">
    <div class="event-box">
      <h2>Add Event</h2>
      <label for="eventTitle">Title</label>
      <input type="text" id="eventTitle" placeholder="e.g. Study session">
      <label for="eventDate">Date</label>
      <input type="date" id="eventDate">
      <div class="event-buttons">
        <button id="saveEvent">Save</button>
        <button id="closeModal" class="cancel-btn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Day Detail Modal -->
  <div class="modal-overlay" id="day-modal">
    <div class="post-modal" style="max-width:460px;">
      <div class="modal-header">
        <h2 id="day-modal-title">Monday, 1 Jan</h2>
        <button class="modal-close-btn" id="close-day-modal">✕</button>
      </div>
      <div class="modal-body" id="day-modal-body" style="gap:10px; max-height:60vh; overflow-y:auto;">
      </div>
      <div class="modal-footer">
        <span></span>
        <button class="post-submit-btn" id="day-add-event-btn">+ Add Event</button>
      </div>
    </div>
  </div>

  <script type="module" src="header.js"></script>
  <script type="module" src="calendar.js"></script>
</body>

</html>
