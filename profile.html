<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile - OnTrack</title>

    <link rel="stylesheet" href="style.css" />
</head>

<body class="profile-page">

    <div id="main-header"></div>

    <main class="page-main profile-main">

        <section class="profile-container">

            <div class="profile-top">

                <div class="profile-image-section">
                    <label for="profile-image-input" class="profile-image-label">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%238faebf'/%3E%3Ccircle cx='50' cy='37' r='22' fill='rgba(255,255,255,0.6)'/%3E%3Cellipse cx='50' cy='92' rx='35' ry='28' fill='rgba(255,255,255,0.6)'/%3E%3C/svg%3E"
                            alt="Profile picture" id="profile-image" class="profile-image">

                        <span class="profile-image-overlay">Change</span>
                    </label>

                    <input type="file" id="profile-image-input" accept="image/*" hidden>
                </div>

                <div class="profile-info">

                    <h1 id="profile-username">Username</h1>

                    <div class="profile-stats">

                        <div class="stat">
                            <span id="posts-count">0</span>
                            <p>Posts</p>
                        </div>

                        <div class="stat">
                            <span id="followers-count">0</span>
                            <p>Followers</p>
                        </div>

                        <div class="stat">
                            <span id="following-count">0</span>
                            <p>Following</p>
                        </div>

                    </div>
                </div>
            </div>

            <div class="posts-grid"></div>

            <div class="logout-wrapper">
                <button id="logout-btn" class="logout-btn">
                    Log out
                </button>
            </div>

        </section>

    </main>
    <script type="module" src="header.js"></script>
    <script type="module" src="profile.js"></script>

</body>

</html>
