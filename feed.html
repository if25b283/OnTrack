<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnTrack</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="feed">

    <div id="main-header"></div>

    <main class="page-main">
        <div class="feed-container">
            <div id="feed-posts">
                <div class="feed-loading">Loading posts…</div>
            </div>
        </div>
    </main>

    <!-- Floating + Button -->
    <button class="fab" id="open-composer" aria-label="Create post">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
    </button>

    <!-- Post Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="post-modal">
            <div class="modal-header">
                <h2>New Post</h2>
                <button class="modal-close-btn" id="close-composer">✕</button>
            </div>

            <div class="modal-body">
                <div class="composer-top">
                    <img src="" alt="You" id="composer-avatar" class="composer-avatar">
                    <textarea id="post-content" placeholder="What's on your mind?" rows="3"></textarea>
                </div>

                <div class="composer-image-preview" id="image-preview-wrapper" style="display:none;">
                    <img id="image-preview" src="" alt="Preview">
                    <button class="remove-image-btn" id="remove-image">✕</button>
                </div>
            </div>

            <div class="modal-footer">
                <label for="post-image-input" class="attach-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" />
                        <circle cx="8.5" cy="8.5" r="1.5" />
                        <polyline points="21 15 16 10 5 21" />
                    </svg>
                    Photo
                </label>
                <input type="file" id="post-image-input" accept="image/*" hidden>
                <button class="post-submit-btn" id="post-submit">Post</button>
            </div>
        </div>
    </div>

    <script type="module" src="header.js"></script>
    <script type="module" src="feed.js"></script>
</body>

</html>
