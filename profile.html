<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile - OnTrack</title>

    <link rel="stylesheet" href="style.css" />
</head>

<body class="profile-page">

    <header class="main-header">

        <div class="header-logo">
            <img src="images/logo.png" alt="OnTrack Logo" class="small-logo">
        </div>

        <nav class="main-nav">
            <a href="todo.html">To-Do</a>
            <a href="calendar.html">Calendar</a>
            <a href="feed.html">Home</a>
            <a href="timer.html">Timer</a>
            <a href="groups.html">Groups</a>
        </nav>

    </header>

    <main class="page-main profile-main">

        <section class="profile-container">

            <div class="profile-top">

                <div class="profile-image-section">
                    <label for="profile-image-input" class="profile-image-label">
                        <img src="https://media.istockphoto.com/id/2151669184/vector/vector-flat-illustration-in-grayscale-avatar-user-profile-person-icon-gender-neutral.jpg?s=612x612&w=0&k=20&c=UEa7oHoOL30ynvmJzSCIPrwwopJdfqzBs0q69ezQoM8="
                            alt="Profile picture" id="profile-image" class="profile-image">

                        <span class="profile-image-overlay">Change</span>
                    </label>

                    <input type="file" id="profile-image-input" accept="image/*" hidden>

                    <p id="upload-message" class="upload-message"></p>
                </div>

                <div class="profile-info">

                    <h1 id="profile-username">Username</h1>

                    <div class="profile-stats">

                        <div class="stat">
                            <span id="posts-count">0</span>
                            <p>Posts</p>
                        </div>

                        <div class="stat">
                            <span id="followers-count">0</span>
                            <p>Followers</p>
                        </div>

                        <div class="stat">
                            <span id="following-count">0</span>
                            <p>Following</p>
                        </div>

                    </div>

                    <p id="profile-email">email@example.com</p>

                </div>
            </div>

            <div class="posts-grid">

                <div class="post-box image-post">
                    <img src="images/post1.jpg" alt="">
                </div>

                <div class="post-box text-post">
                    Ayyyy was geht leute?!
                </div>

                <div class="post-box image-post">
                    <img src="images/post2.jpg" alt="">
                </div>

                <div class="post-box image-post">
                    <img src="images/post3.jpg" alt="">
                </div>

                <div class="post-box image-post">
                    <img src="images/post4.jpg" alt="">
                </div>

                <div class="post-box text-post">
                    My first post guys kinda nervous...
                </div>

            </div>

            <div class="logout-wrapper">
                <button id="logout-btn" class="logout-btn">
                    Log out
                </button>
            </div>

        </section>

    </main>

    <script type="module" src="profile.js"></script>

</body>

</html>
