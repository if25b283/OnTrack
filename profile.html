<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - OnTrack</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="profile-page">

    <header class="main-header">
        <div class="header-logo">
            <img src="images/logo.png" alt="OnTrack Logo" class="small-logo">
        </div>

        <nav class="main-nav">
            <a href="todo.html">To-Do</a>
            <a href="calendar.html">Calendar</a>
            <a href="feed.html">Home</a>
            <a href="timer.html">Timer</a>
            <a href="groups.html">Groups</a>
        </nav>

        <button class="profile-btn active-profile"></button>
    </header>

    <main class="profile-main">
        <section class="profile-card">
            <div class="profile-image-wrapper">
                <img src="images/default-profile.png" alt="Profile picture" id="profile-image" class="profile-image">
            </div>

            <h1 id="profile-username">Username</h1>
            <p id="profile-email">email@example.com</p>

            <div class="profile-stats">
                <div class="stat-box">
                    <span id="followers-count" class="stat-number">0</span>
                    <span class="stat-label">Followers</span>
                </div>

                <div class="stat-box">
                    <span id="following-count" class="stat-number">0</span>
                    <span class="stat-label">Following</span>
                </div>
            </div>

            <button id="logout-btn" class="logout-btn">Log out</button>
        </section>
    </main>

    <script type="module" src="profile.js"></script>
</body>

</html>
